<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>收件箱 · myserver</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header>
        <a class="brand" href="/">myserver <span>/ 收件箱</span></a
        ><button id="logout" class="quiet" hidden>退出</button>
      </header>
      <main>
        <section id="login">
          <h1>收件箱</h1>
          <form id="login-form">
            <label for="token">访问令牌</label>
            <div class="input-row">
              <input
                id="token"
                type="password"
                required
                autocomplete="off"
                placeholder="粘贴终端中的 token"
              /><button type="submit">进入</button>
            </div>
          </form>
        </section>
        <section id="workspace" hidden>
          <div class="heading">
            <h1>收件箱</h1>
            <span id="storage" class="muted"></span>
          </div>
          <section class="composer" id="dropzone">
            <textarea
              id="text"
              rows="2"
              maxlength="20000"
              placeholder="写点什么，或拖入文件"
              aria-label="收件文字"
            ></textarea>
            <div id="selected"></div>
            <div class="compose-tools">
              <label class="file-button" for="files">＋ 添加文件</label
              ><input id="files" type="file" multiple hidden /><button
                id="send"
              >
                发送
              </button>
            </div>
          </section>
          <section id="transfers" aria-label="传输队列"></section>
          <div class="list-tools">
            <input
              id="search"
              type="search"
              placeholder="搜索收件"
              aria-label="搜索收件"
            />
            <select id="type-filter" aria-label="类型">
              <option value="all">全部类型</option>
              <option value="image">图片</option>
              <option value="video">视频</option>
              <option value="audio">音频</option>
              <option value="document">文档</option>
              <option value="archive">压缩包</option>
              <option value="apk">安装包</option>
              <option value="text">文字</option>
              <option value="other">其他</option>
            </select>
            <button
              id="filter-toggle"
              class="quiet"
              aria-expanded="false"
              aria-controls="filter-panel"
            >
              筛选
            </button>
            <button id="selection-toggle" class="quiet" aria-pressed="false">
              选择
            </button>
            <button id="refresh" class="quiet" aria-label="刷新" title="刷新">
              ↻
            </button>
          </div>
          <div id="filter-panel" class="filter-panel" hidden>
            <label
              >来源<select id="source-filter">
                <option value="all">全部来源</option>
                <option value="phone">手机</option>
                <option value="computer">电脑</option>
                <option value="server">服务器</option>
                <option value="other">其他</option>
              </select></label
            >
            <label
              >时间<select id="time-filter">
                <option value="0">不限时间</option>
                <option value="7">最近 7 天</option>
                <option value="30">最近 30 天</option>
              </select></label
            >
            <label
              >排序<select id="sort-filter">
                <option value="newest">最新在前</option>
                <option value="oldest">最早在前</option>
                <option value="name">按名称</option>
                <option value="size">大文件在前</option>
              </select></label
            >
            <button id="reset-filters" class="quiet">重置</button>
          </div>
          <div class="selection-tools" id="selection-tools" hidden>
            <label class="select-loaded"
              ><input id="select-loaded" type="checkbox" />选择已加载</label
            ><span id="selection-count" class="muted" aria-live="polite"
              >未选择</span
            ><button id="download-selected" class="quiet" disabled>
              下载 ZIP</button
            ><button id="delete-selected" class="quiet danger" disabled>
              删除
            </button>
          </div>
          <div id="items"></div>
          <button id="more" class="quiet" hidden>加载更多</button>
        </section>
        <p id="message" role="status" aria-live="polite"></p>
      </main>
    </div>
    <dialog id="edit">
      <form method="dialog" id="edit-form">
        <h2>编辑收件</h2>
        <label for="edit-title">标题</label
        ><input id="edit-title" maxlength="240" required /><label
          for="edit-note"
          >备注</label
        ><textarea id="edit-note" maxlength="2000" rows="4"></textarea>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="quiet">取消</button
          ><button type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
      <div class="viewer-header">
        <div>
          <h2 id="viewer-title"></h2>
          <p id="viewer-meta" class="muted"></p>
        </div>
        <button id="viewer-close" class="quiet" aria-label="关闭预览">×</button>
      </div>
      <div id="viewer-content" class="viewer-content"></div>
      <div class="viewer-actions">
        <button id="viewer-prev" class="quiet" aria-label="上一个文件">←</button
        ><span id="viewer-position" class="muted"></span
        ><button id="viewer-next" class="quiet" aria-label="下一个文件">
          →</button
        ><button id="viewer-zoom" class="quiet" aria-pressed="false" hidden>
          放大</button
        ><button id="viewer-copy" class="quiet" hidden>复制</button
        ><a id="viewer-download" class="download-action">下载</a>
      </div>
    </dialog>
  </body>
</html>
