<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>想法</title>
    <link rel="stylesheet" href="/app/assets/app.css" />
    <script defer src="/app/assets/app.js"></script>
  </head>
  <body>
    <main class="workspace">
      <header>
        <a class="brand" href="/app/">想法<span>.</span></a>
        <div class="header-actions">
          <button id="logout" hidden>退出</button>
        </div>
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="login-panel">
        <p class="eyebrow">THOUGHTS / NOTEBOOK</p>
        <h1>登录你的想法本</h1>
        <form id="login-form">
          <label for="password">管理密码</label
          ><input
            id="password"
            type="password"
            autocomplete="current-password"
            required
          /><button class="primary" type="submit">登录</button>
        </form>
      </section>
      <section id="notebook" hidden>
        <div class="notebook-grid">
          <aside>
            <p class="eyebrow">CAPTURE A THOUGHT</p>
            <h1 id="editor-title">记下这一刻。</h1>
            <form id="editor">
              <label class="sr-only" for="content">想法内容</label
              ><textarea
                id="content"
                rows="9"
                placeholder="有什么想法？"
                maxlength="20000"
                required
              ></textarea
              ><label for="tags">标签</label
              ><input id="tags" placeholder="用逗号分隔，如：技术, 生活" />
              <p class="hint">保存后自动发布到博客。</p>
              <p id="draft-state" class="muted">草稿保存在当前设备</p>
              <div class="form-actions">
                <button class="primary" type="submit">
                  保存想法 <span>↗</span></button
                ><button id="cancel-edit" type="button" hidden>取消编辑</button>
              </div>
            </form>
            <p class="hint">
              Ctrl / ⌘ + Enter 保存<br />Android App
              支持离线记录，联网后打开同步。
            </p>
            <a class="download" href="/downloads/thoughts.apk"
              >下载 Android App ↓</a
            >
          </aside>
          <section class="records">
            <div class="records-heading">
              <h2>我的想法</h2>
              <a href="/api/export" download>导出 JSON ↓</a>
            </div>
            <label class="sr-only" for="search">搜索想法</label
            ><input id="search" type="search" placeholder="搜索内容或标签" />
            <div class="filters" role="group" aria-label="筛选想法">
              <button data-filter="all" aria-pressed="true">全部</button
              ><button data-filter="trash" aria-pressed="false">回收站</button
              ><button id="refresh">刷新 ↻</button>
            </div>
            <div class="publication">
              <p id="publication-status" role="status"></p>
              <button id="publish">重试发布到 Gist</button>
            </div>
            <div id="items" aria-live="polite"></div>
            <button id="more" hidden>加载更多</button>
          </section>
        </div>
      </section>
      <dialog id="history-dialog">
        <div class="records-heading">
          <h2>编辑历史</h2>
          <button id="close-history">关闭</button>
        </div>
        <div id="history-items"></div>
      </dialog>
    </main>
  </body>
</html>
