name: myserver service
on:
  push:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server.yml-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  rpc:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
      - run: pip install pytest==8.4.2
      - run: python -m pytest server/tests -q
      - name: Browser inbox interaction tests
        run: |
          npm install --prefix "$RUNNER_TEMP/inbox-tests" --no-save playwright@1.63.0
          "$RUNNER_TEMP/inbox-tests/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/inbox-tests/node_modules/playwright/index.mjs" INBOX_SCREENSHOTS="$RUNNER_TEMP/inbox-screenshots" node server/tests/inbox-browser.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: myserver-inbox-web-verification
          path: ${{ runner.temp }}/inbox-screenshots/
          retention-days: 14
