name: Thoughts server
on:
  push:
    paths:
      - 'modules/thoughts/server/**'
      - 'modules/thoughts/deploy/**'
      - '.github/workflows/thoughts-server.yml'
  pull_request:
    paths:
      - 'modules/thoughts/server/**'
      - 'modules/thoughts/deploy/**'
      - '.github/workflows/thoughts-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thoughts-server.yml-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  api:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: modules/thoughts/server/requirements.txt
      - run: pip install -r modules/thoughts/server/requirements.txt pytest==8.4.2
      - run: python -m pytest modules/thoughts/server/tests -q
      - run: node --check modules/thoughts/server/static/app.js
