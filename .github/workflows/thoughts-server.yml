name: Thoughts server
on:
  push:
    paths:
      - 'tools/thoughts/server/**'
      - 'tools/thoughts/deploy/**'
      - '.github/workflows/thoughts-server.yml'
  pull_request:
    paths:
      - 'tools/thoughts/server/**'
      - 'tools/thoughts/deploy/**'
      - '.github/workflows/thoughts-server.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thoughts-server.yml-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  api:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tools/thoughts/server/requirements.txt
      - run: pip install -r tools/thoughts/server/requirements.txt pytest==8.4.2
      - run: python -m pytest tools/thoughts/server/tests -q
      - run: node --check tools/thoughts/server/static/app.js
