name: myserver Android
on:
  push:
    branches: ['**']
    paths:
      - 'android/src/**'
      - 'android/res/**'
      - 'android/assets/**'
      - 'android/test/**'
      - 'android/*.sh'
      - 'android/release.py'
      - 'android/AndroidManifest.xml'
      - 'server/service.py'
      - 'server/rpc.py'
      - 'server/database.py'
      - 'server/cli.py'
      - 'server/backups.py'
      - 'server/paths.py'
      - 'server/modules/__init__.py'
      - 'server/modules/thoughts/*.py'
      - 'server/modules/inbox/__init__.py'
      - 'server/modules/inbox/service.py'
      - 'server/modules/inbox/cli.py'
      - 'server/system_metrics.py'
      - 'server/ssh_gateway.py'
      - 'deploy/register-device.py'
      - 'deploy/ssh-gateway.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/src/**'
      - 'android/res/**'
      - 'android/assets/**'
      - 'android/test/**'
      - 'android/*.sh'
      - 'android/release.py'
      - 'android/AndroidManifest.xml'
      - 'server/service.py'
      - 'server/rpc.py'
      - 'server/database.py'
      - 'server/cli.py'
      - 'server/backups.py'
      - 'server/paths.py'
      - 'server/modules/__init__.py'
      - 'server/modules/thoughts/*.py'
      - 'server/modules/inbox/__init__.py'
      - 'server/modules/inbox/service.py'
      - 'server/modules/inbox/cli.py'
      - 'server/system_metrics.py'
      - 'server/ssh_gateway.py'
      - 'deploy/register-device.py'
      - 'deploy/ssh-gateway.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android.yml-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      MYSERVER_KEY_ALIAS: myserver-ci
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Terminal renderer interaction tests
        if: matrix.api == 29
        run: |
          npm install --prefix "$RUNNER_TEMP/terminal-tests" --no-save playwright@1.63.0
          "$RUNNER_TEMP/terminal-tests/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/terminal-tests/node_modules/playwright/index.mjs" node android/test/terminal-renderer.mjs
      - name: Release pipeline checks
        if: matrix.api == 35
        run: python3 android/test/release_checks.py
      - name: Prepare isolated test signing and build provenance
        shell: bash
        run: |
          umask 077
          printf '%s' 'android-ci-only' > "$RUNNER_TEMP/signing-password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/myserver.jks" -storepass:file "$RUNNER_TEMP/signing-password" -alias "$MYSERVER_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 30 -dname 'CN=myserver CI Test'
          base_version=$(python3 -c 'import xml.etree.ElementTree as E; print(E.parse("android/AndroidManifest.xml").getroot().attrib["{http://schemas.android.com/apk/res/android}versionName"])')
          if [[ "$GITHUB_REF" == 'refs/heads/main' && "$GITHUB_EVENT_NAME" != 'pull_request' ]]; then
            echo 'MYSERVER_UPDATE_CHANNEL=stable' >> "$GITHUB_ENV"
            echo "MYSERVER_VERSION_NAME=$base_version" >> "$GITHUB_ENV"
          else
            echo 'MYSERVER_PREVIEW=1' >> "$GITHUB_ENV"
            echo 'MYSERVER_UPDATE_CHANNEL=preview' >> "$GITHUB_ENV"
            echo "MYSERVER_VERSION_NAME=$base_version-preview.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          fi
          echo "MYSERVER_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "MYSERVER_UPDATE_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          echo "MYSERVER_UPDATE_BRANCH=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "MYSERVER_UPDATE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build native APK
        env:
          MYSERVER_KEYSTORE: ${{ runner.temp }}/myserver.jks
          MYSERVER_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/signing-password
        run: |
          export ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          export ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          bash android/build.sh
          bash android/check-boundaries.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated SSH fixture
        run: bash android/test/ssh-fixture.sh
      - name: Native Android smoke tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          MYSERVER_KEYSTORE: ${{ runner.temp }}/myserver.jks
          MYSERVER_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/signing-password
          MYSERVER_SSH_TEST: '1'
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" ANDROID_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" bash android/test.sh
      - name: Preserve the tested API 35 APK for signing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.api == 35 && github.event_name != 'pull_request'
        with:
          name: myserver-android-tested-api35
          path: android/build/myserver.apk
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: myserver-android-verification-api${{ matrix.api }}
          path: |
            android/build/test/screenshots/
            android/build/test/result.txt
            android/build/ssh-fixture/*.log
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/myserver.jks" "$RUNNER_TEMP/signing-password"

  publish:
    timeout-minutes: 15
    needs: android
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;35.0.0'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: myserver-android-tested-api35
          path: android/build/tested
      - name: Sign the tested APK with the persistent channel certificate
        env:
          KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && secrets.MYSERVER_KEYSTORE_BASE64 || (github.ref != 'refs/heads/main' && secrets.MYSERVER_PREVIEW_KEYSTORE_BASE64 || '') }}
          KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.MYSERVER_KEYSTORE_PASSWORD || (github.ref != 'refs/heads/main' && secrets.MYSERVER_PREVIEW_KEYSTORE_PASSWORD || '') }}
          KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && (vars.MYSERVER_KEY_ALIAS || 'myserver') || (vars.MYSERVER_PREVIEW_KEY_ALIAS || 'myserver-preview') }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo 'Persistent signing secrets for this channel are required; no temporary-key update will be published.' >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/channel.jks"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/channel-password"
          mkdir -p android/build/publish
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/channel.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass "file:$RUNNER_TEMP/channel-password" --out android/build/publish/myserver.apk android/build/tested/myserver.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/build/publish/myserver.apk
      - name: Publish a complete update only while this commit is still the branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 android/release.py publish --apk android/build/publish/myserver.apk --build-tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Remove channel signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/channel.jks" "$RUNNER_TEMP/channel-password"
